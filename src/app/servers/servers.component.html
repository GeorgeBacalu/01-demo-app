<label for="server-name">Server Name</label>
<!-- <input type="text" id="server-name" class="form-control" placeholder="Enter server name" (input)="onUpdateServerName($event)"> -->
<input type="text" id="server-name" class="form-control" placeholder="Enter server name" [(ngModel)]="serverName">
<p>{{ serverName }}</p>
<button type="button" class="btn btn-primary" [disabled]="!newServerAllowed" (click)="onCreateServer()">Add Server</button>
<p *ngIf="serverCreated; else noServer">Server was created! The name is: {{ serverName }}</p>
<ng-template #noServer>
  <p>No server was created!</p>
</ng-template>
<app-server *ngFor="let server of servers"></app-server>
